name: Import reviewed PatchProof source archive

on:
  push:
    branches:
      - work/ssrf-special-purpose-ipv4-2026-11-12
    paths:
      - import/PatchProof-source.zip
      - PatchProof-Phase1-Foundation-Hardening-2026-11-12-Continuous-Phases.zip
      - docs/SOURCE_IMPORT_HANDOFF.md

permissions:
  contents: write

concurrency:
  group: patchproof-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: work/ssrf-special-purpose-ipv4-2026-11-12
          persist-credentials: true

      - name: Select and validate the reviewed archive
        id: archive
        shell: bash
        run: |
          if [ -f import/PatchProof-source.zip ]; then
            echo "path=import/PatchProof-source.zip" >> "$GITHUB_OUTPUT"
          elif [ -f PatchProof-Phase1-Foundation-Hardening-2026-11-12-Continuous-Phases.zip ]; then
            echo "path=PatchProof-Phase1-Foundation-Hardening-2026-11-12-Continuous-Phases.zip" >> "$GITHUB_OUTPUT"
          else
            echo "No reviewed source archive is present; nothing to import."
            exit 0
          fi

      - name: Import missing source files without overwriting reviewed files
        if: steps.archive.outputs.path != ''
        run: |
          python3 scripts/import_source_archive.py "${{ steps.archive.outputs.path }}" --destination .

      - name: Remove uploaded archive after successful validation
        if: steps.archive.outputs.path != ''
        run: rm -f "${{ steps.archive.outputs.path }}"

      - name: Commit imported source tree
        if: steps.archive.outputs.path != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "build: import reviewed PatchProof source archive"
            git push origin HEAD:work/ssrf-special-purpose-ipv4-2026-11-12
          fi
