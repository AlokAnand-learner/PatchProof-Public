name: Generate and verify Bun lockfile

on:
  push:
    branches:
      - work/ssrf-special-purpose-ipv4-2026-11-12
    paths:
      - package.json
      - .github/workflows/reproducible-setup.yml

permissions:
  contents: write

concurrency:
  group: patchproof-bun-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: work/ssrf-special-purpose-ipv4-2026-11-12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve dependencies and generate lockfile
        run: bun install --lockfile-only

      - name: Verify frozen dependency installation
        run: bun install --frozen-lockfile

      - name: Commit lockfile when it changes
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "build: add reproducible Bun lockfile"
          git push origin HEAD:work/ssrf-special-purpose-ipv4-2026-11-12
