name: Repository preflight and focused security tests

on:
  push:
    branches:
      - work/ssrf-special-purpose-ipv4-2026-11-12
    paths:
      - scripts/**
      - src/**
      - test/**
      - server.ts
      - index.html
      - vite.config.ts
      - package.json
      - bun.lock
      - .github/workflows/repo-preflight.yml
  pull_request:
    paths:
      - scripts/**
      - src/**
      - test/**
      - server.ts
      - index.html
      - vite.config.ts
      - package.json
      - bun.lock
      - .github/workflows/repo-preflight.yml

permissions:
  contents: read

jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository preflight unit tests
        run: python -m unittest scripts.test_repo_preflight scripts.test_import_source_archive scripts.test_import_source_archive_flow scripts.test_audit_source_archive_conflicts -v
      - name: Audit preserved source archive conflicts (read-only)
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/AlokAnand-learner/PatchProof-Public/1fae022c3419a6552367a4a8715e07fb4bea1d07/PatchProof-Phase1-Foundation-Hardening-2026-11-12-Continuous-Phases.zip" \
            --output /tmp/patchproof-reviewed-source.zip
          python scripts/audit_source_archive_conflicts.py /tmp/patchproof-reviewed-source.zip --destination .

  app-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Audit packages with install scripts before trusting any
        run: bun pm untrusted
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check application
        run: bun run typecheck
      - name: Build application
        run: bun run build
      - name: Start local application for integration tests
        shell: bash
        run: |
          bun run dev > /tmp/patchproof-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/status >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/patchproof-server.log
            echo "PatchProof local server did not become ready."
            exit 1
          fi
          bun run test
