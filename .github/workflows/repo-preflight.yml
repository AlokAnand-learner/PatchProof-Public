name: Repository preflight and focused security tests

on:
  push:
    branches:
      - work/ssrf-special-purpose-ipv4-2026-11-12
    paths:
      - scripts/**
      - src/**
      - test/**
      - server.ts
      - index.html
      - vite.config.ts
      - package.json
      - bun.lock
      - .github/workflows/repo-preflight.yml
  pull_request:
    paths:
      - scripts/**
      - src/**
      - test/**
      - server.ts
      - index.html
      - vite.config.ts
      - package.json
      - bun.lock
      - .github/workflows/repo-preflight.yml

permissions:
  contents: read

jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository preflight unit tests
        run: python -m unittest scripts.test_repo_preflight scripts.test_import_source_archive scripts.test_import_source_archive_flow -v

  app-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check application
        run: bun run typecheck
      - name: Build application
        run: bun run build
      - name: Run complete test suite
        run: bun run test
